name: Release

# A tag vX.Y.Z publishes the image as `X.Y.Z`, `X.Y` and `latest` and a GitHub release with the notes from
# CHANGELOG.md. A tag with a pre-release part (vX.Y.Z-rc1, anything with a `-`) publishes only `X.Y.Z-rc1` and
# `rc`, never `latest` or `X.Y`, and a GitHub pre-release with the unreleased notes.
# Run it by hand ("Run workflow") with a tag such as v0.0.0-test for a dry run: it prints the image tags it
# would push and checks them, without building, pushing or releasing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to simulate (dry run, nothing is pushed)
        required: true
        default: v0.0.0-test

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: kind
        name: Version and release kind
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag (vX.Y.Z or vX.Y.Z-suffix)"; exit 1
          fi
          if [[ "$TAG" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "$TAG: prerelease=$prerelease"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/slotserve
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.kind.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.kind.outputs.tag }},enable=${{ steps.kind.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.kind.outputs.prerelease == 'false' }}
            type=raw,value=rc,enable=${{ steps.kind.outputs.prerelease == 'true' }}
          labels: |
            org.opencontainers.image.title=SlotServe
            org.opencontainers.image.description=Book GPU time slots and serve llama.cpp models behind an OpenAI-compatible API
            org.opencontainers.image.licenses=MIT
      - name: Check the image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PRERELEASE: ${{ steps.kind.outputs.prerelease }}
          VERSION_TAG: ${{ steps.kind.outputs.tag }}
        run: |
          echo "Image tags:"; echo "$TAGS"
          names=$(echo "$TAGS" | sed -n 's/.*://p' | sort | tr '\n' ' ')
          version="${VERSION_TAG#v}"
          if [ "$PRERELEASE" = true ]; then
            expected=$(printf '%s\n' "$version" rc | sort | tr '\n' ' ')
          else
            expected=$(printf '%s\n' "$version" "${version%.*}" latest | sort | tr '\n' ' ')
          fi
          if [ "$names" != "$expected" ]; then
            echo "::error::expected tags [$expected], got [$names]"; exit 1
          fi
          if [ "$PRERELEASE" = true ] && echo "$TAGS" | grep -q ':latest$'; then
            echo "::error::a pre-release must never be tagged latest"; exit 1
          fi
      - if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          # X.Y.Z: its CHANGELOG section (fails if there is none); X.Y.Z-rc1: Unreleased plus changes/unreleased/.
          python3 tools/release_notes.py notes "$version" > notes.md
          {
            echo ""
            echo "**Docker image:** \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slotserve:${version}\`"
          } >> notes.md
          cat notes.md
      - name: Create or update the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${prerelease[@]}"
          fi
