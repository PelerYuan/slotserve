name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: pytest -q
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            e2e/requirements.txt
      - run: pip install -e backend -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q e2e

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: slotserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (no GPU)
        run: |
          docker run -d --name slotserve -p 8000:8000 \
            -e SLOTSERVE_SECRET_KEY=ci -e SLOTSERVE_INVITE_CODE=ci slotserve:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs slotserve
          exit 1

  contract-docker:
    # L3 contract tests (backend/tests/contract) against a real Docker daemon: the same cases the backend job
    # runs against the fake. No GPU on these runners, so GPU cases skip. Includes the SSH login into a container
    # built from the golden booking spec with the image's own Dropbear (key, environment, password, wrong password).
    name: Docker contract (real Docker, no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: docker/setup-buildx-action@v4
      - name: Build the bundled Dropbear (the image's dropbear stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dropbear
          push: false
          outputs: type=local,dest=${{ runner.temp }}/dropbear
          cache-from: type=gha
      - run: sudo apt-get install -y -qq sshpass openssh-client >/dev/null
      - run: pip install -e "backend[dev]"
      - run: docker version
      - run: pytest -q -rs tests/contract
        working-directory: backend
        env:
          SLOTSERVE_TEST_DOCKER: "1"
          SLOTSERVE_TEST_DROPBEAR: ${{ runner.temp }}/dropbear/out/dropbearmulti
