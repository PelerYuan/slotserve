name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - run: pytest -q
        working-directory: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            e2e/requirements.txt
      - run: pip install -e backend -r e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q e2e

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: slotserve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image (no GPU)
        run: |
          docker run -d --name slotserve -p 8000:8000 \
            -e SLOTSERVE_SECRET_KEY=ci -e SLOTSERVE_INVITE_CODE=ci slotserve:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs slotserve
          exit 1
      - name: SSH into a dev environment container (no GPU)
        # Builds the files exactly as SlotServe does for a booking (booking_ssh_files) with the bundled
        # Dropbear and a host key made by SlotServe's own generator (per-environment host keys), then logs in to a
        # stock Ubuntu container with a key and with a password, checking the host key against its fingerprint.
        run: |
          set -eux
          sudo apt-get install -y -qq sshpass >/dev/null
          cid=$(docker create slotserve:ci)
          docker cp "$cid:/opt/slotserve/bin/dropbearmulti" ./dropbearmulti
          docker rm "$cid"
          ssh-keygen -q -t ed25519 -N "" -f client
          mkdir -p ctx
          docker run --rm -v "$PWD:/w" -w /w --entrypoint python slotserve:ci -c '
          import pathlib
          from slotserve.services.devenv import SshBundle, booking_ssh_files
          from slotserve.services.devenv.ssh import generate_host_key, host_public_key
          from slotserve.services.shacrypt import sha512_crypt
          key = generate_host_key()
          pathlib.Path("known_hosts").write_text("[127.0.0.1]:2222 " + host_public_key(key) + chr(10))
          bundle = SshBundle(pathlib.Path("dropbearmulti").read_bytes(), key)
          files = booking_ssh_files(bundle, [pathlib.Path("client.pub").read_text().strip()], sha512_crypt("ci-secret-pw"))
          for rel, (data, mode) in files.items():
              path = pathlib.Path("ctx", rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              path.chmod(mode)
          '
          sudo chmod 700 ctx/opt/slotserve/ssh
          sudo chown -R 0:0 ctx
          docker create --name devenv -p 2222:22 -e FROM_IMAGE=yes --init --user root -w /workspace \
            --mount type=volume,source=ci-workspace,target=/workspace \
            --entrypoint /bin/sh ubuntu:24.04 /opt/slotserve/start.sh
          sudo tar -C ctx -cf - opt etc | docker cp - devenv:/
          docker start devenv
          sleep 2
          opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$PWD/known_hosts -o ConnectTimeout=5"
          for i in $(seq 1 20); do
            ssh $opts -o BatchMode=yes -i client -p 2222 root@127.0.0.1 true 2>/dev/null && break
            sleep 0.5
          done
          ssh $opts -o BatchMode=yes -i client -p 2222 root@127.0.0.1 \
            'echo LOGIN_OK; echo "env=$FROM_IMAGE"; id -u' | tee out
          grep -q LOGIN_OK out
          grep -q env=yes out
          sshpass -p ci-secret-pw ssh $opts -o PubkeyAuthentication=no -p 2222 root@127.0.0.1 'echo PASSWORD_OK' | tee out2
          grep -q PASSWORD_OK out2
          if sshpass -p wrong-password ssh $opts -o PubkeyAuthentication=no -p 2222 root@127.0.0.1 true; then
            echo "a wrong password must be refused"; exit 1
          fi
          docker logs devenv
