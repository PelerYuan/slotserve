name: Bug report / 问题反馈
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / 发生了什么？
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: version
    attributes:
      label: SlotServe version / 版本
      description: Settings → About
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment / 环境
      description: GPU, driver and CUDA version, llama.cpp commit, OS, Docker or bare metal
      placeholder: GPU model and memory, driver, CUDA version, llama.cpp build, OS, Docker or bare metal
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Relevant output of `docker compose logs` and Models → Server log.
      render: text
