[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slotserve"
version = "0.8.0"
description = "Book GPU time slots and serve llama.cpp models behind an OpenAI-compatible gateway."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.4",
  "httpx[socks]>=0.27",
  "itsdangerous>=2.2",
  "tzdata>=2024.1",
  "cryptography>=42",
  "websockets>=14",  # the dev environment web proxy (also installed by uvicorn[standard])
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
slotserve = "slotserve.__main__:main"

[tool.setuptools.packages.find]
include = ["slotserve*"]

[tool.setuptools.package-data]
slotserve = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
