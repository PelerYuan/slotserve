name: slotserve

services:
  slotserve:
    build:
      context: .
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.8.1-runtime-ubuntu24.04}
    image: slotserve:latest
    container_name: slotserve
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-side paths; the host paths are mapped in `volumes` below.
      SLOTSERVE_HOST: 0.0.0.0
      SLOTSERVE_PORT: 8000
      SLOTSERVE_DATA_DIR: /data
      SLOTSERVE_MODELS_DIR: /models
      SLOTSERVE_LLAMA_SERVER_CMD: /opt/llama.cpp/llama-server
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Directory that contains your compiled `llama-server` and its .so files.
      - ${LLAMA_CPP_DIR:?Set LLAMA_CPP_DIR in .env}:/opt/llama.cpp:ro
      # GGUF models (an SSD makes model switching much faster).
      - ${MODELS_DIR:?Set MODELS_DIR in .env}:/models
      # SQLite database and llama-server logs.
      - ${DATA_DIR:-./data}:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
