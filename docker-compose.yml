name: slotserve

services:
  slotserve:
    build:
      context: .
      args:
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.8.1-runtime-ubuntu24.04}
    # `docker compose pull` uses the prebuilt image; `docker compose up -d --build` builds it locally
    # (needed when your llama.cpp was built against a CUDA major other than the default CUDA_IMAGE).
    image: ${SLOTSERVE_IMAGE:-ghcr.io/peleryuan/slotserve:latest}
    container_name: slotserve
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-side paths; the host paths are mapped in `volumes` below.
      SLOTSERVE_HOST: 0.0.0.0
      SLOTSERVE_PORT: 8000
      SLOTSERVE_DEVENV_WEB_PORT: 8001
      SLOTSERVE_DATA_DIR: /data
      SLOTSERVE_MODELS_DIR: /models
      SLOTSERVE_LLAMA_SERVER_CMD: /opt/llama.cpp/llama-server
    ports:
      # Also the address node agents of other machines connect to (docs: Multiple machines, docker-compose.node.yml).
      - "${PORT:-8000}:8000"
      # Web interfaces of dev environments (desktop, JupyterLab, VS Code, ...) are served on their own port so the
      # browser keeps them apart from SlotServe. Publishing it on another host port? Set SLOTSERVE_DEVENV_WEB_URL.
      # Direct ports (2300-2399 by default) and SSH ports are published by Docker itself, not here.
      - "${DEVENV_WEB_PORT:-8001}:8001"
    volumes:
      # Directory that contains your compiled `llama-server` and its .so files.
      - ${LLAMA_CPP_DIR:?Set LLAMA_CPP_DIR in .env}:/opt/llama.cpp:ro
      # GGUF models (an SSD makes model switching much faster).
      - ${MODELS_DIR:?Set MODELS_DIR in .env}:/models
      # SQLite database and llama-server logs.
      - ${DATA_DIR:-./data}:/data
      # Dev environments (Admin > System settings): lets SlotServe start containers on this host.
      # Mounting the Docker socket gives SlotServe root access to the host; only enable it if you want the feature.
      # - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
